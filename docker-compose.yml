version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otis-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - otis-network

networks:
  otis-network:
    driver: bridge





